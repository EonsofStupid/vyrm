name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline
    permissions:
      contents: read
    uses: ./.github/workflows/ci-reusable.yml
    with:
      linux-standard-runner: >-
        ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
            && vars.CI_SELF_HOSTED_ENABLED == 'true'
            && (vars.CI_LINUX_STANDARD_RUNNER || '["ubuntu-latest"]')
            || '["ubuntu-latest"]' }}
      linux-heavy-runner: >-
        ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
            && vars.CI_SELF_HOSTED_ENABLED == 'true'
            && (vars.CI_LINUX_HEAVY_RUNNER || '["ubuntu-latest"]')
            || '["ubuntu-latest"]' }}
