name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector@sha256:1d50c689b0a6511b9ea0a15615281c81a59fd04a08eb35057ec8646fb3a2118a
        env:
          POSTGRES_USER: vyrm_test
          POSTGRES_PASSWORD: vyrm_test_password
          POSTGRES_DB: vyrm_operator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyrm_test -d vyrm_operator_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        env:
          VYRM_PGVECTOR_TEST_URL: postgresql://vyrm_test:vyrm_test_password@127.0.0.1:5432/vyrm_operator_test?sslmode=disable
          VYRM_PGVECTOR_TEST_DISPOSABLE: "1"
        run: cargo test --workspace --all-features --locked
      - name: Deny warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify controlled evaluation evidence
        run: cargo run --locked -p vyrm-eval -- verify eval/results/2026-08-18-summary.json
      - name: Enforce kernel dependency boundary
        run: |
          tree="$(cargo tree --locked -p vyrm-core --edges normal --depth 1)"
          printf '%s\n' "$tree"
          test "$(printf '%s\n' "$tree" | tail -n +2 | wc -l)" -eq 1
          printf '%s\n' "$tree" | tail -n 1 | grep -q 'serde v'
      - name: Enforce offline edge dependency and binary budgets
        run: |
          tree="$(cargo tree --locked -p vyrm-edge --edges normal)"
          printf '%s\n' "$tree"
          ! printf '%s\n' "$tree" | grep -Eiq 'reqwest|hyper|tokio|rustls|openssl|ureq|curl|quinn|tonic'
          local_model_tree="$(cargo tree --locked -p vyrm-embed --features fastembed-local --edges normal)"
          printf '%s\n' "$local_model_tree"
          ! printf '%s\n' "$local_model_tree" | grep -Eiq 'reqwest|hyper|tokio|rustls|openssl|ureq|curl|quinn|tonic|hf-hub'
          cargo build --locked --release -p vyrm-edge
          binary="${CARGO_TARGET_DIR:-target}/release/vyrm-edge"
          test "$(stat -c '%s' "$binary")" -le 2097152
