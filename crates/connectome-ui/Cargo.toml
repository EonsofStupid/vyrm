[package]
name = "connectome-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local developer workbench and visualizer for vyrm/connectome instances"

[dependencies]
vyrm-core = { path = "../vyrm-core" }
vyrm-node = { path = "../vyrm-node" }
vyrm-store = { path = "../vyrm-store" }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "connectome"
path = "src/main.rs"
