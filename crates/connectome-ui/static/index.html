<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Connectome · RRD</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="mark"><i></i><i></i><i></i></span><div><strong>connectome</strong><small>RRD client</small></div></div>
      <section class="instance" id="instance"><span>INSTANCE</span><strong>Connecting…</strong><small>Authenticated public contract</small></section>
      <nav aria-label="Diagnostic views">
        <button class="active" data-view="overview">Overview <kbd>1</kbd></button>
        <button data-view="models">Models <b id="model-count">0</b></button>
        <button data-view="graph">Graph <b id="graph-count">0</b></button>
        <button data-view="activity">Activity <b id="change-count">0</b></button>
        <button data-view="capabilities">Capabilities <b id="capability-count">0</b></button>
        <button data-view="query">Query <kbd>6</kbd></button>
        <button data-view="raw">Raw snapshot</button>
      </nav>
      <footer><span id="status-dot" class="dot waiting"></span><span id="status">Connecting</span></footer>
    </aside>
    <section class="workspace">
      <header><div><span id="crumb-instance">rrd</span><b>/</b><span id="crumb-view">overview</span></div><span id="stamp">—</span><button id="refresh" title="Refresh">Refresh</button></header>
      <main id="main" tabindex="-1"><div class="loading">Reading a verified diagnostic snapshot…</div></main>
    </section>
  </div>
  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
