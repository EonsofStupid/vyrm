[package]
name = "rrd-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RRD loopback server lifecycle and persistent session/transaction coordinator."

[dependencies]
rrd-contract = { path = "../rrd-contract" }
rrd-estate = { path = "../rrd-estate" }
vyrm-core = { path = "../vyrm-core" }
vyrm-store = { path = "../vyrm-store" }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.3"
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
sysinfo = "0.39.6"
