[package]
name = "vyrmd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "stdio MCP server for the vyrm reasoning runtime"

[dependencies]
vyrm-core = { path = "../vyrm-core" }
vyrm-node = { path = "../vyrm-node" }
vyrm-store = { path = "../vyrm-store" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vyrmd"
path = "src/main.rs"
