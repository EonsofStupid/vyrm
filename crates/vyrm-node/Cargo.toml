[package]
name = "vyrm-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "vyrm runtime experience: preflight, harness hooks, stack profiles, harness registry."

[dependencies]
vyrm-core = { path = "../vyrm-core" }
vyrm-graph = { path = "../vyrm-graph" }
vyrm-ql = { path = "../vyrm-ql" }
vyrm-mx = { path = "../vyrm-mx" }
vyrm-store = { path = "../vyrm-store" }
vyrm-vector = { path = "../vyrm-vector" }
vyrm-embed = { path = "../vyrm-embed" }
vyrm-operator = { path = "../vyrm-operator" }
vyrm-cluster = { path = "../vyrm-cluster", features = ["object-transfer"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
