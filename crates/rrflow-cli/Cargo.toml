[package]
name = "rrflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "rrflow operator surface: explicit, recorded invocation of every trigger."

[dependencies]
rrd-core = { path = "../rrd-core" }
rrd-engine = { path = "../rrd-engine" }
rrd-store = { path = "../rrd-store" }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
rrd-lsm = { path = "../rrd-lsm" }
# A/B harness only: real token counts for both arms of the controlled
# comparison. o200k_base is a proxy tokenizer — no Claude tokenizer is
# public — which is sound because the reported quantity is the ratio and
# both arms are counted by the same tokenizer.
tiktoken-rs = "0.12"

[[bin]]
name = "rrflow"
path = "src/main.rs"
