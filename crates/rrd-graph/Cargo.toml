[package]
name = "rrd-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "rrflow routing projection: attunement, symbol and dependency index, query routing."

[dependencies]
rrd-core = { path = "../rrd-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-svelte-ng = "1.0"

[dev-dependencies]
# Persistence wiring is exercised from tests and examples only: the library
# stays substrate-free until rrd-engine exists to own the composition.
rrd-store = { path = "../rrd-store" }
tempfile = "3"
