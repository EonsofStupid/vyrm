[package]
name = "rrd-estate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Persistent RRD estate authority and reconciliation contracts."

[dependencies]
rrd-contract = { path = "../rrd-contract" }
vyrm-core = { path = "../vyrm-core" }
vyrm-store = { path = "../vyrm-store" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
sysinfo = "0.39.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
