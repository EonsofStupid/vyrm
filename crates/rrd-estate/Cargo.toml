[package]
name = "rrd-estate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Persistent RRD estate authority and reconciliation contracts."

[[bin]]
name = "rrd-backup-controller"
path = "src/commands/rrd-backup-controller.rs"

[[bin]]
name = "rrd-deployment-catalog"
path = "src/commands/rrd-deployment-catalog.rs"

[[bin]]
name = "rrd-estate-admin"
path = "src/commands/rrd-estate-admin.rs"

[[bin]]
name = "rrd-estate-controller"
path = "src/commands/rrd-estate-controller.rs"

[dependencies]
rrd-contract = { path = "../rrd-contract" }
rrd-core = { path = "../rrd-core" }
rrd-store = { path = "../rrd-store" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
sysinfo = "0.39.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
