[package]
name = "vyrm-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Project-scoped external operator-knowledge contracts and adapter port for Vyrm."

[features]
default = []
pgvector-postgres = ["dep:native-tls", "dep:postgres", "dep:postgres-native-tls"]

[dependencies]
vyrm-core = { path = "../vyrm-core" }
vyrm-vector = { path = "../vyrm-vector" }
serde = { workspace = true }
serde_json = { workspace = true }
native-tls = { version = "0.2.14", optional = true }
postgres = { version = "0.19.14", features = ["with-serde_json-1"], optional = true }
postgres-native-tls = { version = "0.5.3", optional = true }

[dev-dependencies]
tempfile = "3"
