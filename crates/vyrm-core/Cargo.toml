[package]
name = "vyrm-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "vyrm kernel: bi-temporal claims, key encoding, supersession. No transport, no policy, no storage engine."

# vyrm-core must compile and test with every outer layer removed.
# It must never depend on fjall, a transport, or tier policy.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
