[package]
name = "rrd-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Supported asynchronous Rust client for the RRD v1 service contract."

[dependencies]
rrd-contract = { path = "../rrd-contract" }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
http-body-util = "0.1.5"
futures-util = { version = "0.3", features = ["sink"] }
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
rrd-engine = { path = "../rrd-engine" }
rrd-estate = { path = "../rrd-estate" }
rrd-security = { path = "../rrd-security" }
rrd-server = { path = "../rrd-server" }
rrd-core = { path = "../rrd-core" }
rrd-store = { path = "../rrd-store" }
tempfile = "3"
rcgen = "0.14"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
