[package]
name = "rrd-kubernetes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kubernetes CRD and reconciliation controller for secured RRD instances."

[dependencies]
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
kube = { version = "4.2", features = ["runtime", "derive"] }
rrd-contract = { path = "../rrd-contract" }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = "2"
rrd-core = { path = "../rrd-core" }

[dev-dependencies]
tempfile = "3"
