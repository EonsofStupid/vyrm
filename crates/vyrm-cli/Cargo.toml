[package]
name = "vyrm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "vyrm operator surface: explicit, recorded invocation of every trigger."

[dependencies]
vyrm-core = { path = "../vyrm-core" }
vyrm-store = { path = "../vyrm-store" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vyrm"
path = "src/main.rs"
