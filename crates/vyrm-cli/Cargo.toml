[package]
name = "vyrm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "vyrm operator surface: explicit, recorded invocation of every trigger."

[dependencies]
vyrm-core = { path = "../vyrm-core" }
vyrm-store = { path = "../vyrm-store" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
# A/B harness only: real token counts for both arms of the controlled
# comparison. o200k_base is a proxy tokenizer — no Claude tokenizer is
# public — which is sound because the reported quantity is the ratio and
# both arms are counted by the same tokenizer.
tiktoken-rs = "0.12"

[[bin]]
name = "vyrm"
path = "src/main.rs"
