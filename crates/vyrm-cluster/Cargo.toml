[package]
name = "vyrm-cluster"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Canonical Multi-AZ contracts and deterministic failure simulation for Vyrm."

[features]
default = []
openraft-adapter = ["dep:openraft", "dep:vyrm-kv", "dep:vyrm-store"]

[dependencies]
vyrm-core = { path = "../vyrm-core" }
vyrm-kv = { path = "../vyrm-kv", optional = true }
vyrm-store = { path = "../vyrm-store", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
openraft = { version = "=0.9.25", optional = true, features = ["serde", "storage-v2"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
