[package]
name = "vyrm-embed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Provider-neutral, provenance-bound embedding jobs for Vyrm."

[features]
default = []
fastembed-local = ["dep:fastembed"]

[dependencies]
vyrm-core = { path = "../vyrm-core" }
serde = { workspace = true }
serde_json = { workspace = true }
fastembed = { version = "5.17.4", default-features = false, features = ["ort-load-dynamic"], optional = true }

[dev-dependencies]
vyrm-store = { path = "../vyrm-store" }
