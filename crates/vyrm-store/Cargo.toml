[package]
name = "vyrm-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "vyrm substrate adapter: Fjall keyspaces, durability classes, batch commit."

[dependencies]
vyrm-core = { path = "../vyrm-core" }
fjall = "=3.1.8"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Child process for tests/durability.rs. Declared as a bin so integration tests
# receive its path through CARGO_BIN_EXE_durability-child.
[[bin]]
name = "durability-child"
path = "src/bin/durability-child.rs"
