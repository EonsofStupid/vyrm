[package]
name = "rrd-inference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Provider-neutral, provenance-bound embedding jobs for Rrd."

[features]
default = []
fastembed-local = ["dep:fastembed"]

[dependencies]
rrd-core = { path = "../rrd-core" }
serde = { workspace = true }
serde_json = { workspace = true }
fastembed = { version = "5.17.4", default-features = false, features = ["ort-load-dynamic"], optional = true }

[dev-dependencies]
rrd-store = { path = "../rrd-store" }
