[project]
name = "rrflow-rrd-client"
version = "0.1.0a1"
description = "Supported Python client for the RRFlow Durable Runtime v1 API"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rrd_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rrd_client"]
mypy_path = "src"
