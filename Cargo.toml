[workspace]
resolver = "2"
members = [
    "crates/vyrm-core",
    "crates/vyrm-store",
    "crates/vyrm-graph",
    "crates/vyrm-node",
    "crates/vyrm-cli",
]

# Future members, added as each layer lands. Dependency arrows point inward:
# core <- store <- graph <- gate <- {node, cli, vyrmd}
#   "crates/vyrm-gate",
#   "crates/vyrmd",

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EonsofStupid/vyrm"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Step T: spans at subsystem boundaries, zero-cost with no subscriber
# installed. The kernel (vyrm-core) stays out — serde is its only dependency.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
